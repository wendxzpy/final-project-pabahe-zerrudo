<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HarvestHub — Local Produce Marketplace</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <section aria-labelledby="marketplace-heading">
      <header class="section-header top-header">
        <div>
          <h1 id="marketplace-heading">HarvestHub Local Produce</h1>
          <p>Fresh farm goods with transparent unit pricing and live stock availability.</p>
        </div>
        <div class="header-actions">
          <button id="toggle-orders-btn" type="button" class="secondary-btn">
            My Orders (<span id="orders-count">0</span>)
          </button>
          <button id="toggle-cart-btn" type="button" class="details-btn cart-toggle-btn">
            Order Summary (<span id="cart-count">0</span>)
          </button>
        </div>
      </header>

      <div class="marketplace-controls">
        <label for="search-input" class="visually-hidden">Search produce</label>
        <input id="search-input" type="search" placeholder="Search produce (e.g., tomatoes)..." />

        <label for="category-select" class="visually-hidden">Filter by category</label>
        <select id="category-select">
          <option value="All">All Categories</option>
          <option value="Vegetables">Vegetables</option>
          <option value="Fruits">Fruits</option>
        </select>

        <label for="farmer-select" class="visually-hidden">Filter by farmer</label>
        <select id="farmer-select">
          <option value="All">All Farmers</option>
        </select>

        <button id="clear-filters-btn" type="button" class="secondary-btn">Reset Filters</button>
      </div>

      <aside id="order-confirmation" class="order-confirmation" aria-live="polite" hidden></aside>

      <aside id="order-summary-panel" class="order-summary-panel" aria-live="polite" hidden></aside>

      <aside id="my-orders-panel" class="my-orders-panel" aria-live="polite" hidden></aside>

      <aside id="order-tracking-panel" class="order-tracking-panel" aria-live="polite" hidden></aside>

      <aside id="product-details" class="product-details" aria-live="polite" hidden></aside>

      <div id="produce-grid" class="produce-grid"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
